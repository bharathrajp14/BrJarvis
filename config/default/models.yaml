# config/default/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Priority: Environment Variables > models.yaml > models.json > Defaults

proxy:
  base_url: "http://127.0.0.1:20128/v1"
  api_key_env: "BRJARVIS_PROXY_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: false

routing:
  default_backend: "gpt"
  default_model: "antigravity/gemini-3.7-flash-high"
  disable_gemini: true
  
  # Capability-specific defaults
  capabilities:
    chat: "antigravity/gemini-3.7-flash-high"
    fast_chat: "antigravity/gemini-3.7-flash-high"
    ultra_fast: "antigravity/gemini-3.1-pro-low"
    reasoning: "auto/best-reasoning"
    deep_reasoning: "antigravity/claude-opus-4-6-thinking"
    planning: "antigravity/gemini-3.7-flash-high"
    agent: "antigravity/gemini-3.7-flash-high"
    pro_agent: "antigravity/gemini-pro-agent"
    super_agent: "antigravity/gemini-3.7-flash-high"
    code: "auto/best-coding"
    code_review: "kr/claude-sonnet-4.5"
    vision: "auto/best-vision"
    image: "openrouter/google/gemini-3.1-flash-image-preview"
    summarization: "auto/best-chat"
    classification: "auto/fast"
    extraction: "auto/fast"
    long_context: "antigravity/gemini-3.1-pro-low"
    low_latency: "antigravity/gemini-3.7-flash-high"
    voice_live: "antigravity/gemini-3.7-flash-high"
    fallback: "auto/chat"
    gpt_compatible: "github/gpt-4o-mini"
    pro_high: "antigravity/gemini-pro-agent"
    pro_low: "antigravity/gemini-3.1-pro-low"

  # Fallback sequence preference
  fallback_hierarchy:
    - "antigravity/gemini-3.7-flash-high"
    - "kr/claude-sonnet-4.5"
    - "auto/best-chat"
    - "auto/best-coding"
    - "auto/best-reasoning"
    - "auto/fast"
    - "github/gpt-4o-mini"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90
