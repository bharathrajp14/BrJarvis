# config/default/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Priority: Environment Variables > models.yaml > models.json > Defaults

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "BRJARVIS_PROXY_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: false

routing:
  default_backend: "gpt"
  default_model: "gemini-3.1-pro-high"
  disable_gemini: true
  
  # Capability-specific defaults
  capabilities:
    chat: "gemini-3.1-pro-high"
    fast_chat: "gemini-3.8-flash-high"
    ultra_fast: "gemini-3.8-flash-low"
    reasoning: "claude-opus-4-6-thinking"
    deep_reasoning: "claude-opus-4-6-thinking"
    planning: "gemini-3.1-pro-high"
    agent: "gemini-pro-agent"
    pro_agent: "gemini-pro-agent"
    super_agent: "gemini-3.1-pro-high"
    code: "claude-sonnet-4-6"
    code_review: "claude-sonnet-4-6"
    vision: "gemini-3.7-flash-high"
    image: "gemini-3.1-flash-image"
    summarization: "gemini-3.7-flash-medium"
    classification: "gemini-3.8-flash-medium"
    extraction: "gemini-3.8-flash-tiered"
    long_context: "gemini-3.1-pro-high"
    low_latency: "gemini-3.8-flash-high"
    voice_live: "gemini-3.8-flash-high"
    fallback: "gemini-3.7-flash-high"
    gpt_compatible: "github/gpt-4o-mini"
    pro_high: "antigravity/gemini-pro-agent"
    pro_low: "antigravity/gemini-3.1-pro-low"

  # Fallback sequence preference
  fallback_hierarchy:
    - "antigravity/gemini-3.7-flash-high"
    - "kr/claude-sonnet-4.5"
    - "auto/best-chat"
    - "auto/best-coding"
    - "auto/best-reasoning"
    - "auto/fast"
    - "github/gpt-4o-mini"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90
