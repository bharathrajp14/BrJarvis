# config/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Calibrated from Live Model Benchmark Probing against http://localhost:8045/v1 (Antigravity Proxy)

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "BRJARVIS_PROXY_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

# Secondary provider (free models, auto-enabled when OPENROUTER_API_KEY is set)
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"

# OmniRouter local gateway
omnirouter:
  base_url: "http://127.0.0.1:20128/v1"
  api_key_env: "OMNIROUTER_API_KEY"

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: false

routing:
  default_backend: "gpt"
  default_model: "gemini-3.1-pro-high"
  disable_gemini: true

  # Capability-specific model mappings — all proxied through Antigravity Proxy (http://localhost:8045/v1)
  capabilities:
    chat:             "gemini-3.1-pro-high"
    fast_chat:        "gemini-3.8-flash-high"
    ultra_fast:       "gemini-3.8-flash-low"
    reasoning:        "claude-opus-4-6-thinking"
    deep_reasoning:   "claude-opus-4-6-thinking"
    planning:         "gemini-3.1-pro-high"
    agent:            "gemini-pro-agent"
    pro_agent:        "gemini-pro-agent"
    super_agent:      "gemini-3.1-pro-high"
    code:             "claude-sonnet-4-6"
    code_review:      "claude-sonnet-4-6"
    vision:           "gemini-3.7-flash-high"
    image:            "gemini-3.1-flash-image"
    summarization:    "gemini-3.7-flash-medium"
    classification:   "gemini-3.8-flash-medium"
    extraction:       "gemini-3.8-flash-tiered"
    long_context:     "gemini-3.1-pro-high"
    low_latency:      "gemini-3.8-flash-high"
    voice_live:       "gemini-3.8-flash-high"
    fallback:         "gemini-3.7-flash-high"
    gpt_compatible:   "gpt-oss-120b-medium"
    pro_high:         "gemini-3.1-pro-high"
    pro_low:          "gemini-3.1-pro-low"

  # Ordered fallback chain with verified responsive models
  fallback_hierarchy:
    - "gemini-3.1-pro-high"
    - "claude-sonnet-4-6"
    - "gemini-3.8-flash-high"
    - "claude-opus-4-6-thinking"
    - "gemini-3.7-flash-high"
    - "gpt-oss-120b-medium"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90
