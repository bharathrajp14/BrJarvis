# ════════════════════════════════════════════════════════════════════════════
#  BR JARVIS — AI Gateway Routing Configuration
#  Three-Tier Provider Hierarchy:
#    TIER 1 (PRIMARY)   — Antigravity Custom Proxy  (http://127.0.0.1:20128/v1)
#    TIER 2 (SECONDARY) — OpenRouter Free Models    (https://openrouter.ai/api/v1)
#    TIER 3 (EMERGENCY) — OmniRouter                (http://127.0.0.1:20128/v1)
#
#  API keys are referenced by environment-variable name only.
#  Supported strategies: priority, weighted, round_robin, cost, latency.
# ════════════════════════════════════════════════════════════════════════════

cooldown_seconds: 15

backends:
  # ── TIER 1: Antigravity Custom Proxy at localhost:8045 ────────────────────
