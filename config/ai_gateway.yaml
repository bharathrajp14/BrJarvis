# ── Route Policies ────────────────────────────────────────────────────────────
# Each policy picks an ordered fallback chain from the backends above.
# All backend IDs verified online: 2026-08-28 probe (20/30 online).

routes:
  # DEFAULT: Active Proxy first → Local Ollama
  default:
    strategy: priority
    backends:
      - proxy_gemini_36_flash_high
      - proxy_claude_sonnet46
      - proxy_claude_opus46_thinking
      - proxy_gemini_36_flash_low
      - local_ollama
    max_fallbacks: 4

  # PROXY ONLY: Verified online Antigravity models.
  proxy:
    strategy: priority
    backends:
      - proxy_gemini_36_flash_high
      - proxy_claude_sonnet46
      - proxy_claude_opus46_thinking
      - proxy_gemini_37_flash_high
      - proxy_gemini_36_flash_low
    max_fallbacks: 4

  # FAST: Lowest latency proxy models first.
  fast:
    strategy: latency
    backends:
      - proxy_gemini_36_flash_low
      - proxy_gemini_36_flash_high
      - proxy_claude_sonnet46
      - local_ollama
    required_capabilities: [chat]
    max_fallbacks: 3

  # CODING: Best coding models from proxy.
  coding:
    strategy: priority
    backends:
      - proxy_claude_sonnet46
      - proxy_claude_opus46_thinking
      - proxy_gemini_36_flash_high
      - local_ollama
    required_capabilities: [code]
    max_fallbacks: 3

  # REASONING: Deep reasoning models.
  reasoning:
    strategy: priority
    backends:
      - proxy_claude_opus46_thinking
      - proxy_claude_sonnet46
      - proxy_gemini_36_flash_high
    required_capabilities: [reasoning]
    max_fallbacks: 3

  # VISION: Image-capable models.
  vision:
    strategy: priority
    backends:
      - proxy_gemini_36_flash_high
      - proxy_gemini_31_flash_image
    required_capabilities: [vision]
    max_fallbacks: 2

  # AGENT: Agentic + tool-capable models.
  agent:
    strategy: priority
    backends:
      - proxy_gemini_3_flash_agent
      - proxy_gemini_pro_agent
      - proxy_gemini_37_flash_high
      - proxy_gemini_pro_high
      - openrouter_poolside_laguna
      - manus
    required_capabilities: [agent]
    max_fallbacks: 4

  # BUDGET: Free-tier only (zero cost guaranteed).
  budget:
    strategy: cost
    backends:
      - proxy_gemini_35_flash_extra_low
      - proxy_gemini_36_flash_low
      - openrouter_nemotron_super
      - openrouter_gemma4
      - openrouter_poolside_laguna
      - openrouter_minimax
      - openrouter_auto
      - local_ollama
    max_fallbacks: 6

  # LOCAL ONLY: 100% offline, never calls cloud.
  local:
    strategy: priority
    backends:
      - local_ollama
    max_fallbacks: 0

  # EMERGENCY: OpenRouter verified free models when proxy is totally down.
  emergency:
    strategy: priority
    backends:
      - openrouter_nemotron_ultra
      - openrouter_nemotron_super
      - openrouter_poolside_laguna
      - openrouter_gemma4
      - openrouter_minimax
      - openrouter_auto
      - local_ollama
    max_fallbacks: 6
