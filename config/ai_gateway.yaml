  # Priority 10: highest; tried first in every route.

  - id: proxy_gemini_36_flash_high
    provider: openai-compatible
    model: antigravity/gemini-3.7-flash-high
    base_url: http://127.0.0.1:20128/v1
    api_key_env: BRJARVIS_PROXY_API_KEY
    enabled: true
    priority: 10
    weight: 5
    cost_per_1k_tokens: 0
    latency_ms: 500
    capabilities: [chat, code, reasoning, vision, tools, agent]
    max_context: 1048576

  - id: proxy_gemini_pro_high
